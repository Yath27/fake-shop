name: Playwright UI Tests

on:
  deployment_status:

permissions:
  contents: read

jobs:
  ui-tests:
    name: Run external UI tests on preview
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production' &&
      github.event.deployment_status.target_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fake-shop
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Checkout Playwright tests
        uses: actions/checkout@v5
        with:
          repository: Yath27/fake-shop-playwright-tests
          ref: main
          path: playwright-tests
          token: ${{ secrets.PLAYWRIGHT_TESTS_REPO_TOKEN }}

      - name: Install Playwright project dependencies
        working-directory: playwright-tests
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: playwright-tests
        run: npx playwright install --with-deps chromium

      - name: Wait for preview and run UI tests
        shell: bash
        run: |
          bypass_header=()
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            bypass_header+=(--header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          for attempt in {1..30}; do
            if curl --fail --silent "${bypass_header[@]}" "$BASE_URL/api/health" > /dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent "${bypass_header[@]}" "$BASE_URL/api/health" > /dev/null; then
            echo "Vercel preview did not become healthy: $BASE_URL"
            exit 1
          fi

          cd playwright-tests
          npm test
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
